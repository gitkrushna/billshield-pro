name: BillShield checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint && pnpm typecheck && pnpm build && pnpm check:client-secrets
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.14"
      - run: uv sync --project api --frozen
      - run: uv run --project api ruff check api/src tests scripts
      - name: Adapter and safe selector unit checks
        run: >-
          uv run --project api pytest tests/test_auth.py tests/test_storage.py
          tests/test_jobs.py tests/test_seed.py tests/test_engine.py tests/test_pipeline.py
          tests/test_llm.py tests/test_corpus.py tests/test_ingest_m2.py tests/test_execution.py
          -k "not reconciliation_and_no_certification"
      - name: Private corpus acceptance boundary
        run: echo "::notice::Private reference research is deliberately excluded from Git. Actual seed-twice reconciliation and restricted-role isolation evidence must be reviewed at the M1 checkpoint; this job does not certify them."

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
