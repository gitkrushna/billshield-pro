[project]
name = "billshield-api"
version = "0.1.0"
description = "BillShield evidence-first engine and portable infrastructure adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pypdf>=6,<7",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billshield"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
